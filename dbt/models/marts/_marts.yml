version: 2

models:

  - name: fct_hourly_demand
    description: >
      One row per UTC hour in the analysis window (17,424). Trips started, weather from
      Open-Meteo and the official feed, New York calendar columns, and the snowstorm
      closure flag. The table Power BI reads.
    columns:
      - name: hour_utc
        description: Start of the hour, in UTC. The grain of this table.
        data_tests: [unique, not_null]
      - name: trip_count
        description: Trips started in this hour. 0 = counted, nobody rode.
        data_tests: [not_null]
      - name: member_trip_count
        description: Trips by annual members (usertype = Subscriber).
        data_tests: [not_null]
      - name: casual_trip_count
        description: Trips by casual riders (usertype = Customer).
        data_tests: [not_null]
      - name: date_local
        description: New York calendar date. Joins to dim_date.date_day in Power BI.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: is_system_closed
        description: True inside a run of closure_min_hours+ consecutive zero-trip hours (snowstorm shutdowns).
        data_tests: [not_null]
      - name: precipitation_mm
        description: Open-Meteo precipitation that fell during this hour.
        data_tests: [not_null]
      - name: official_status
        description: observed / filled / missing for the official-feed columns.
        data_tests: [not_null]

  - name: dim_date
    description: >
      One row per New York calendar date in the window (726). Calendar attributes, season,
      and the US federal holiday flag. Mark as the date table in Power BI.
    columns:
      - name: date_day
        description: The date. Primary key.
        data_tests: [unique, not_null]
      - name: is_holiday
        data_tests: [not_null]

  - name: agg_daily_weather_demand
    description: >
      One row per New York date (726). Daily trips, weather totals and a day type
      (Snowy / Rainy / Dry / Light). Compares each day with dry days of the same month and
      weekday/weekend (pct_vs_dry_days_same_month). Closure days and holidays are flagged
      as not comparable. Answers the brief's rainy/snowy vs clear-day question.
    columns:
      - name: date_local
        data_tests: [unique, not_null]
      - name: day_type
        data_tests: [not_null]
      - name: trips
        data_tests: [not_null]

  - name: fct_hourly_expected_demand
    description: >
      One row per UTC hour (17,424): actual trips, expected (normal) trips = level x shape,
      the residual and % deviation. Level = median of the previous 8 same weekdays;
      shape = average hourly share on comparable dry days by season x weekday x hour.
      is_comparable_hour marks the hours used in the weather analysis.
    columns:
      - name: hour_utc
        data_tests: [unique, not_null]
      - name: is_comparable_hour
        data_tests: [not_null]
